name: MiniMart CI and GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test all services
        run: mvn -B clean verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend with mocked HTTP
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build isolated H2 test applications
        run: mvn -B -Plocal-test clean package

      - name: Check existing business flow on local applications
        run: python3 scripts/smoke.py --local

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push five service images
        run: |
          for service in catalog-service customer-service gateway order-service shipping-service; do
            image="ghcr.io/lehoangviet9/minimart-${service}"
            docker build \
              --file "services/${service}/Dockerfile" \
              --tag "${image}:${GITHUB_SHA}" \
              --tag "${image}:latest" \
                    "."
            docker push "${image}:${GITHUB_SHA}"
            docker push "${image}:latest"
          done

      - name: Build and push frontend image
        run: |
          image="ghcr.io/lehoangviet9/minimart-frontend"
          docker build \
            --file frontend/Dockerfile \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:latest" \
            frontend
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
