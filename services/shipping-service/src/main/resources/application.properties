spring.application.name=shipping-service
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=5s
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/minimart_shipping_db}
spring.datasource.username=${DB_USER:shipping}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
