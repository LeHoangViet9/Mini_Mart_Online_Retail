name: minimart
x-business: &business
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
services:
  frontend:
    build: {context: ../frontend, dockerfile: Dockerfile}
    restart: unless-stopped
    ports: ['${HTTP_PORT:-80}:80']
    environment:
      API_URL: ${FRONTEND_API_URL:-http://gateway:8080}
    networks: [edge]
    depends_on:
      - gateway
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minimart_admin
      POSTGRES_DB: minimart_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_admin_change_me}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-local_catalog_change_me}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-local_customer_change_me}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-local_order_change_me}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:-local_shipping_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U minimart_admin -d minimart_admin && test -f /var/lib/postgresql/data/PG_VERSION']
      interval: 5s
      timeout: 3s
      retries: 30
  catalog-service:
    <<: *business
    build: {context: .., dockerfile: services/catalog-service/Dockerfile}
    environment:
      DB_USER: catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-local_catalog_change_me}
  customer-service:
    <<: *business
    build: {context: .., dockerfile: services/customer-service/Dockerfile}
    environment:
      DB_USER: customer
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-local_customer_change_me}
  order-service:
    <<: *business
    build: {context: .., dockerfile: services/order-service/Dockerfile}
    environment:
      DB_USER: orders
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-local_order_change_me}
  shipping-service:
    <<: *business
    build: {context: .., dockerfile: services/shipping-service/Dockerfile}
    environment:
      DB_USER: shipping
      DB_PASSWORD: ${SHIPPING_DB_PASSWORD:-local_shipping_change_me}
  gateway:
    build: {context: .., dockerfile: services/gateway/Dockerfile}
    restart: unless-stopped
    networks: [edge, backend]
    depends_on:
      - catalog-service
      - customer-service
      - order-service
      - shipping-service
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - '${MONITORING_BIND_ADDRESS:-127.0.0.1}:9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [backend, monitoring]
    depends_on:
      - gateway
      - catalog-service
      - customer-service
      - order-service
      - shipping-service
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/.env before starting Grafana}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '${MONITORING_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [backend, monitoring]
    depends_on:
      - prometheus
networks:
  edge: {}
  backend:
    internal: true
  monitoring: {}
volumes:
  postgres-data: {}
  prometheus-data: {}
  grafana-data: {}
